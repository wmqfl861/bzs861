name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-17
        with:
          persist-credentials: false
      - name: Reject CRLF in the index (CL-21)
        run: |
          bad=$(git ls-files --eol | awk '($1=="i/crlf"||$1=="i/mixed") && $3!="attr/-text"')
          if [ -n "$bad" ]; then
            echo "files stored with CRLF in the index:"; echo "$bad"; exit 1
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev libxml2-dev libjson-c-dev libssl-dev libboost-dev python3-venv
      - name: Install the Python worker and pinned test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/requirements-s1-lock.txt
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e "python[test]"
          .venv/bin/python -m pip check
      - name: Build and test core, contracts, HTTP, worker and MCP
        run: |
          cmake --preset dev -DBZS_PYTHON="$PWD/.venv/bin/python" -DBZS_REQUIRE_PYTHON_TESTS=ON
          cmake --build --preset dev -j 2
          ctest --preset dev --output-junit "$PWD/build/ctest-results.xml"
          .venv/bin/python tools/verify_ctest_junit.py "$PWD/build/ctest-results.xml" --minimum 42
      - name: Verify capture mutations (CL-03r)
        timeout-minutes: 30
        env:
          MUTATION_OUTPUT_DIR: ${{ github.workspace }}/mutation-logs
          MUTATION_SUITE_TIMEOUT: "600"
        run: |
          set -o pipefail
          mkdir -p "$MUTATION_OUTPUT_DIR"
          .venv/bin/python tools/test_mutation_check.py 2>&1 | tee "$MUTATION_OUTPUT_DIR/harness-tests.log"
          # Reuse the tested dev build. The script restores source and rebuilds
          # the affected targets on exit, before any later normal test consumer.
          bash tools/mutation_check.sh "$PWD" "$PWD/build" cmake Debug 2>&1 | tee "$MUTATION_OUTPUT_DIR/summary.log"
      - name: Address and undefined-behavior checks
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --preset asan -DBZS_PYTHON="$PWD/.venv/bin/python" -DBZS_REQUIRE_PYTHON_TESTS=ON
          cmake --build --preset asan-core -j 2
          ./build-asan/bzs_storage_maintenance_tests
          ./build-asan/bzs_background_pool_tests
          ./build-asan/bzs_receipt_retention_tests
          ./build-asan/bzs_archive_quota_tests
          ./build-asan/bzs_incremental_storage_tests
          ./build-asan/bzs_tests
          ./build-asan/bzs_batch_tests
          ./build-asan/bzs_map_tests
          ./build-asan/bzs_crawl_tests
          ./build-asan/bzs_site_publication_tests
          ./build-asan/bzs_contract_tests docs/planning/validation/contract_cases.json
          ./build-asan/bzs_retention_tests
          ./build-asan/bzs_fairness_tests
          ./build-asan/bzs_session_tests
          ./build-asan/bzs_revalidation_tests
          ./build-asan/bzs_direct_shared_tests
          ./build-asan/bzs_revocation_tests
          ./build-asan/bzs_source_publication_tests
          ./build-asan/bzs_cache_freshness_tests
          ./build-asan/bzs_search_mode_tests
          ./build-asan/bzs_capacity_cycles_tests
          ./build-asan/bzs_gram_index_tests
          ./build-asan/bzs_long_document_recall_tests
      - name: Original contracts and planning safeguards
        run: |
          .venv/bin/python docs/planning/tools/validate_contracts.py
          .venv/bin/python docs/planning/tools/plan_v1_2.py check
          .venv/bin/python tools/test_plan_guard.py
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-tests-${{ github.sha }}
          path: |
            build/ctest-results.xml
            build/Testing/Temporary/*.log
            mutation-logs/*.log
          retention-days: 14
          if-no-files-found: warn
  linux-tsan:
    # ThreadSanitizer over the offline native test binaries (the Python
    # worker e2e suites are out of scope here). The request pool, the
    # background pools, the Store lock and the json-c lock are the core
    # concurrency surfaces; a manual run on 6410d27 was clean, this job
    # keeps it that way (CL-11).
    name: linux-tsan (native offline tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-17
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev libxml2-dev libjson-c-dev libssl-dev libboost-dev
      - name: Build with ThreadSanitizer
        # No CMAKE_BUILD_TYPE: the sanitizer flags carry the recommended
        # -O1 -g and must not be overridden by the Debug -O0 defaults.
        run: |
          cmake -S . -B build-tsan -GNinja -DCMAKE_CXX_FLAGS="-fsanitize=thread -O1 -g" -DBZS_BUILD_TESTS=ON
          cmake --build build-tsan -j 2
      - name: Run native offline test binaries under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          ./build-tsan/bzs_storage_maintenance_tests
          ./build-tsan/bzs_background_pool_tests
          ./build-tsan/bzs_request_executor_tests
          ./build-tsan/bzs_receipt_retention_tests
          ./build-tsan/bzs_archive_quota_tests
          ./build-tsan/bzs_incremental_storage_tests
          ./build-tsan/bzs_tests
          ./build-tsan/bzs_batch_tests
          ./build-tsan/bzs_map_tests
          ./build-tsan/bzs_crawl_tests
          ./build-tsan/bzs_site_publication_tests
          ./build-tsan/bzs_contract_tests docs/planning/validation/contract_cases.json
          ./build-tsan/bzs_retention_tests
          ./build-tsan/bzs_fairness_tests
          ./build-tsan/bzs_session_tests
          ./build-tsan/bzs_revalidation_tests
          ./build-tsan/bzs_direct_shared_tests
          ./build-tsan/bzs_revocation_tests
          ./build-tsan/bzs_source_publication_tests
          ./build-tsan/bzs_cache_freshness_tests
          ./build-tsan/bzs_search_mode_tests
          ./build-tsan/bzs_capacity_cycles_tests
          ./build-tsan/bzs_gram_index_tests
          ./build-tsan/bzs_long_document_recall_tests
  linux-release:
    # Release is the configuration users actually run; exercise the offline
    # native suites and the stdlib-only integration suites against a
    # Release build (CL-11).
    name: linux-release (native offline tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-17
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev libxml2-dev libjson-c-dev libssl-dev libboost-dev
      - name: Build Release
        run: |
          cmake --preset release
          cmake --build --preset release -j 2
      - name: Offline native and stdlib integration tests (Release)
        run: |
          ctest --test-dir build-release --output-on-failure \
            -R "^(storage_maintenance|incremental_storage|archive_quota|receipt_retention|background_pool|gram_index|long_document_recall|request_executor|core|batch|map|crawl|site_publication|retention|fairness|sessions|source_publication|search_modes|revalidation|direct_shared|revocation|capacity_cycles|cache_freshness_[123]|contracts|launcher_lifecycle|cache_shard_contract|ci_reporting|http_cli|http_revocation)$" \
            --output-junit "$PWD/build-release/ctest-results.xml"
          python3 tools/verify_ctest_junit.py "$PWD/build-release/ctest-results.xml" --minimum 31
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-tests-${{ github.sha }}
          path: |
            build-release/ctest-results.xml
            build-release/Testing/Temporary/*.log
          retention-days: 14
          if-no-files-found: warn
  windows:
    # Full worker packaging remains in S9. Preserve the already established,
    # blocking native core, batch, map, crawl, publication, contract, retention,
    # fairness, session and HTTP/CLI tests on Windows.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out the pinned vcpkg baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: microsoft/vcpkg
          ref: 6719fd4d4cd3b2d4575f6164da4a02f757b3b067
          path: .build-tools/vcpkg
          persist-credentials: false
      - name: Install C++ dependencies
        shell: pwsh
        run: |
          & ./.build-tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.build-tools/vcpkg/vcpkg.exe install "sqlite3[fts5]:x64-windows" libxml2:x64-windows json-c:x64-windows openssl:x64-windows boost-beast:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build-win -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/.build-tools/vcpkg/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-win --config Debug --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # CL-10: the heavy persistent suites gate on RelWithDebInfo (measured
          # 3.5-8.3x faster than Debug on a Windows 11 reference VM; Debug keeps
          # the fast subset below). Same multi-config build dir, targeted build.
          cmake --build build-win --config RelWithDebInfo --parallel 2 --target bzs_tests bzs_session_tests bzs_direct_shared_tests bzs_capacity_cycles_tests bzs_long_document_recall_tests bzs_cache_freshness_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline native and HTTP tests
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE/.build-tools/vcpkg/installed/x64-windows/debug/bin;$env:GITHUB_WORKSPACE/.build-tools/vcpkg/installed/x64-windows/bin;$env:PATH"
          # CL-10: Debug runs the fast subset; the heavy persistent suites run
          # RelWithDebInfo. The union is exactly the pre-CL-10 gate (31 tests).
          ctest --test-dir build-win -C Debug -R "^(batch|map|crawl|site_publication|contracts|retention|fairness|source_publication|search_modes|revalidation|revocation|http_cli|http_revocation|request_executor|gram_index|background_pool|receipt_retention|archive_quota|incremental_storage|storage_maintenance|launcher_lifecycle|cache_shard_contract|ci_reporting)$" --verbose --output-on-failure --output-junit "$env:GITHUB_WORKSPACE/build-win/ctest-results-debug.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-win -C RelWithDebInfo -R "^(core|sessions|direct_shared|capacity_cycles|long_document_recall|cache_freshness_[123])$" --verbose --output-on-failure --output-junit "$env:GITHUB_WORKSPACE/build-win/ctest-results-relwithdebinfo.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify collected Windows JUnit
        shell: pwsh
        run: |
          python tools/verify_ctest_junit.py "$env:GITHUB_WORKSPACE/build-win/ctest-results-debug.xml" "$env:GITHUB_WORKSPACE/build-win/ctest-results-relwithdebinfo.xml" --minimum 31
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-tests-${{ github.sha }}
          path: |
            build-win/ctest-results-debug.xml
            build-win/ctest-results-relwithdebinfo.xml
            build-win/Testing/Temporary/*.log
          retention-days: 14
          if-no-files-found: warn
